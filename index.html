<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu !</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="screen active" id="start-screen">
            <h1>Jeu !</h1>
            <p>Prêt à jouer ?</p>
            <label for="num-questions">Number of Questions:</label>
            <input type="number" id="num-questions" min="1" max="36" value="5">
            <label for="num-seconds">Seconds:</label>
            <input type="number" id="num-seconds" min="5" max="120" value="30">

            <button id="start-btn">Commencer</button>
        </div>
        
        <div class="screen" id="quiz-screen">
            <div class="quiz-header">
                <h1 style=" color: #2596be; margin-bottom: 30px;"> Nommez...</h1>
                <h3 id="question-text">Question goes here</h3>
                <div class="quiz-info">
                    <p> Question <span id="current-question">1</span> of <span id="total-questions">5</span></p>
                    <button id="show-answers-btn" style="display:none;">Reponses</button>
                    <button id="next-question-btn" style="display:none;">Prochain</button>
                    
                </div>
            </div>

            

            <div id="answers-container" class="answers-container">
                     <!--Answers inserted w js-->
            </div>
           
            <div class="timer-bar">
                <div id="timer" class="timer"></div>
            </div>

        </div>
        
        <div id="result-screen" class="screen">
            <h1>Résultats</h1>
            <div class="result-info">
                <div id="result-message"></div>
            </div>
            <button id="restart-btn">Recommencer</button>
        </div>

    </div>
    <script src="script.js" defer></script>
</body>
</html>
